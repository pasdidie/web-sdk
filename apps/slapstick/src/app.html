<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<title>Slapstick</title>
		<!--
			The original Stake stylesheet link here was a studio-account-locked
			web font kit that never actually served anything from our domain
			('proxima-nova' silently fell back to the browser default serif
			everywhere). Replaced with self-hosted fonts: Limelight (Art Deco
			silent-film titles, SIL OFL) for SLAPSTICK, Cinzel kept for shared UI, below (static/fonts/) rather than
			requested from a third-party font host at runtime -- approval
			guidelines disallow external CDN requests at launch (static files
			only, no calls but the RGS). One variable-weight woff2 covers
			400-900. See docs/DECISIONS.md.
		-->
		<style>
			@font-face {
				font-family: 'Limelight';
				src: url('./fonts/limelight.woff2') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: block;
			}
			@font-face {
				font-family: 'Cinzel';
				src: url('./fonts/cinzel-variable.woff2') format('woff2');
				font-weight: 100 900;
				font-style: normal;
				font-display: block;
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
